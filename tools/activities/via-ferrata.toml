# Activity page: Via ferrata over the Atlantic
# Builds the page freesummitpt.com/via-ferrata/  (the web address comes from this file's name).
# Each text has an English (en) and a Portuguese (pt) version.
# After editing, run:  python tools/build_pages.py

# Position in the "More activities" buttons on the other pages
order = 2
# Activity pre-selected in the booking form. Must match a value in _shared.toml
form_value = "Via Ferrata dos Pinheirinhos (Sesimbra)"

# Browser tab title and the description shown by Google / when shared
title = "Via ferrata in Sesimbra · Free Summit"
description = "Guided via ferrata at Pinheirinhos, Sesimbra: 800 m along the sea cliffs of Arrábida. No climbing experience needed. Guide, gear and insurance included. €65 per person."

# Small line above the big heading
place = "Sesimbra"
# Big price in the hero
price = "€65"
# Button text when this activity is listed under "More activities" on other pages
link = { en = "Via ferrata in Sesimbra", pt = "Via ferrata em Sesimbra" }

# Big heading
[heading]
en = "Via ferrata over the Atlantic"
pt = "Via ferrata sobre o Atlântico"

# Text under the heading
[intro]
en = "800 metres along the sea cliffs of Pinheirinhos, Sesimbra, clipped to a steel cable the whole way. No climbing experience needed, just a head for heights."
pt = "800 metros pelas falésias dos Pinheirinhos, em Sesimbra, sempre preso a um cabo de aço. Não precisas de experiência em escalada, só de gostar de alturas."

# Small text next to the big price
[price_note]
en = "per person · guide, gear and insurance included"
pt = "por pessoa · guia, material e seguro incluídos"

# --- Key facts strip (one [[facts]] block per fact) ---
[[facts]]
label = { en = "Duration", pt = "Duração" }
value = { en = "~4 hours", pt = "~4 horas" }

[[facts]]
label = { en = "Route", pt = "Percurso" }
value = { en = "800 m · K3", pt = "800 m · K3" }

[[facts]]
label = { en = "Height gain", pt = "Desnível" }
value = { en = "195 m", pt = "195 m" }

[[facts]]
label = { en = "Min. age", pt = "Idade mín." }
value = { en = "12 years", pt = "12 anos" }

[[facts]]
label = { en = "Group", pt = "Grupo" }
value = { en = "2 to 8", pt = "2 a 8" }

# --- "The activity": one [[about]] block per paragraph ---
[[about]]
en = "A half-day via ferrata along the limestone cliffs west of Sesimbra, inside the Arrábida Natural Park, with the Luiz Saldanha Marine Park below you the whole way."
pt = "Uma via ferrata de meio-dia pelas falésias de calcário a oeste de Sesimbra, dentro do Parque Natural da Arrábida, com o Parque Marinho Luiz Saldanha sempre por baixo."

[[about]]
en = "The route traverses the cliffs on steel cables, rungs and some fixed ropes. You are clipped in at all times with an energy-absorbing lanyard, and your guide is beside you on every section, with a rope for the harder steps."
pt = "O percurso atravessa as falésias por cabos de aço, degraus e algumas cordas fixas. Estás sempre preso com um kit de via ferrata com absorvedor de energia, e o guia vai contigo em todas as secções, com corda para os passos mais difíceis."

[[about]]
en = "It is very exposed and very beautiful. It suits active adults and teenagers who feel fine with heights and can walk and scramble for 3 to 4 hours."
pt = "É muito aéreo e muito bonito. É indicado para adultos e jovens activos que se sintam bem nas alturas e aguentem 3 a 4 horas a caminhar e trepar."

# --- "Included" list ---
[[included]]
en = "Guide on every section"
pt = "Guia em todas as secções"

[[included]]
en = "Harness, helmet and via ferrata lanyard set (EN 958)"
pt = "Arnês, capacete e kit de via ferrata (EN 958)"

[[included]]
en = "Via ferrata gloves"
pt = "Luvas de via ferrata"

[[included]]
en = "Rope and kit for short belays on hard steps"
pt = "Corda e material para os passos mais difíceis"

[[included]]
en = "Activity insurance"
pt = "Seguro de actividade"

