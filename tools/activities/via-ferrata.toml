# Note under the price table
[price_table_note]
en = "Minimum 2 participants per departure. In summer we avoid the midday hours, and we reschedule in strong wind or rain."
pt = "Mínimo de 2 participantes por saída. No verão evitamos as horas de maior calor, e reagendamos com vento forte ou chuva."

# --- "The plan" timeline ---
[[plan]]
step = { en = "Meet", pt = "Encontro" }
text = { en = "Welcome at the Pinheirinhos parking, safety briefing and gear fitting.", pt = "Boas-vindas no parque dos Pinheirinhos, briefing de segurança e ajuste do material." }

[[plan]]
step = { en = "Approach", pt = "Aproximação" }
text = { en = "About 45 minutes on coastal paths down to the start.", pt = "Cerca de 45 minutos por trilhos costeiros até ao início." }

[[plan]]
step = { en = "Via ferrata", pt = "Via ferrata" }
text = { en = "The cliff traverse, with photo stops over the sea.", pt = "A travessia da falésia, com paragens para fotos sobre o mar." }

[[plan]]
