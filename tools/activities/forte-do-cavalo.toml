# Note under the price table
[price_table_note]
en = "Minimum 2 participants per departure. In summer we climb in the late afternoon, and we reschedule in strong wind, big swell or rain."
pt = "Mínimo de 2 participantes por saída. No verão escalamos ao fim da tarde, e reagendamos com vento forte, ondulação grande ou chuva."

# --- "The plan" timeline ---
[[plan]]
step = { en = "Meet", pt = "Encontro" }
text = { en = "Welcome, gear fitting and safety briefing by the fort.", pt = "Boas-vindas, ajuste do material e briefing junto ao forte." }

[[plan]]
step = { en = "To the crag", pt = "Até à falésia" }
text = { en = "About 10 minutes on foot to the Portugal dos Pequeninos sector.", pt = "Cerca de 10 minutos a pé até ao sector Portugal dos Pequeninos." }

[[plan]]
step = { en = "Skills", pt = "Técnica" }
text = { en = "Knots, belaying and climbing calls. The guide checks every belay.", pt = "Nós, segurar e comandos de escalada. O guia verifica cada segurança." }

[[plan]]
step = { en = "Climb", pt = "Escalar" }
text = { en = "Routes of rising difficulty above the sea, taking turns climbing and belaying.", pt = "Vias de dificuldade crescente sobre o mar, à vez a escalar e a segurar." }

[[plan]]
step = { en = "Finish", pt = "Fim" }
text = { en = "Pack up, walk back and debrief.", pt = "Arrumar, regresso e conversa final." }

